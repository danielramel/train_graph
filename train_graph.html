<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>RailGraph — Train graph</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><a class="brand-mark" href="index.html" aria-label="Go to projects"><span></span><span></span><span></span></a><div><strong><a href="index.html">RailGraph</a></strong><small>TRAIN GRAPH CREATOR</small></div></div>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="main-nav" id="workspace-nav" aria-label="Workspace"></nav>
        <div class="sidebar-bottom"><div class="project-card"><div class="project-card-head"><span class="status-dot"></span><span>ACTIVE PROJECT</span></div><strong id="sidebar-project-name">Morning regional</strong><small id="sidebar-project-meta">6 stations · 42.8 km</small></div><div class="sidebar-footer"><span class="avatar">LM</span><div><strong>Line planner</strong><small>Local workspace</small></div><button class="icon-button" title="Workspace settings" aria-label="Workspace settings">⋯</button></div></div>
      </aside>
      <main class="main-content">
        <header class="topbar"><div class="breadcrumb"><a href="index.html">Projects</a><b>/</b><strong id="project-breadcrumb">Morning regional</strong></div><div class="topbar-actions"><span class="saved-state"><span class="saved-dot"></span><span id="save-status">Saved locally</span></span><button class="button button-secondary" id="reset-project">Reset</button><button class="button button-primary" id="export-project"><span>↓</span> Export JSON</button></div></header>
        <section class="tab-panel active" id="panel-graph" role="tabpanel">
          <div class="section-intro graph-intro"><div><h2>Train graph</h2></div><div class="graph-actions"><div class="legend" id="graph-legend"></div><button class="button button-secondary" id="download-svg"><span>↓</span> Download SVG</button></div></div>
          <div class="graph-card"><div class="chart-wrap"><svg id="train-chart" role="img" aria-label="Train time-distance graph"></svg><div class="chart-empty" id="chart-empty" hidden>Add at least two stations to see the graph.</div></div></div>
        </section>
        <footer class="app-footer"><span><span class="keyboard-key">⌘</span><span class="keyboard-key">S</span> Changes are saved automatically</span><span>RailGraph v1.0 <span class="footer-separator">·</span> Built for clear operations</span></footer>
      </main>
    </div>
    <script src="layout.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
