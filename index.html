<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>RailGraph — Choose a line</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .line-picker { max-width: 900px; margin: 0 auto; padding: 72px 24px; }
      .line-picker-header { margin-bottom: 30px; }
      .line-picker-header h1 { margin-bottom: 10px; }
      .line-picker-header p { color: var(--muted); font-size: 12px; }
      .line-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      .line-card { background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: 22px; box-shadow: var(--shadow); }
      .line-card h2 { margin: 0 0 8px; font-size: 16px; }
      .line-card p { min-height: 34px; margin: 0 0 18px; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .line-meta { display: flex; gap: 16px; margin-bottom: 20px; color: #8995a5; font: 10px 'DM Mono', monospace; }
      .line-card .button { width: 100%; justify-content: center; }
    </style>
  </head>
  <body>
    <main class="line-picker">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div><strong>RailGraph</strong><small>TRAIN GRAPH CREATOR</small></div>
      </div>
      <div class="line-picker-header">
        <div class="eyebrow"><span class="eyebrow-line"></span> PROJECTS</div>
        <h1>Choose a line</h1>
        <p>Select an example project to open it in the line infrastructure editor.</p>
      </div>
      <div class="line-grid" id="line-grid"></div>
    </main>
    <script>
      const grid = document.querySelector('#line-grid');
      fetch('/api/lines')
        .then((response) => {
          if (!response.ok) throw new Error(`Could not load lines (${response.status})`);
          return response.json();
        })
        .then((lines) => {
          grid.innerHTML = Object.entries(lines).map(([id, line]) => {
            const distance = line.stations.at(-1)?.distance || 0;
            return `<article class="line-card"><h2>${line.name}</h2><p>Select this line to edit its infrastructure and timetable.</p><div class="line-meta"><span>${line.stations.length} STATIONS</span><span>${distance} KM</span></div><button class="button button-primary" data-line="${id}">Open line</button></article>`;
          }).join('');
          grid.querySelectorAll('[data-line]').forEach((button) => button.addEventListener('click', () => {
            localStorage.setItem('railgraph-line-id', button.dataset.line);
            localStorage.removeItem('railgraph-project');
            window.location.href = `infrastructure.html?line=${encodeURIComponent(button.dataset.line)}`;
          }));
        })
        .catch((error) => {
          grid.innerHTML = `<p>Could not load lines. Start the server with <code>npm start</code>.</p>`;
          console.error(error);
        });
    </script>
  </body>
</html>
